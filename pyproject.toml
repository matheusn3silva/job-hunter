[project]
name = "jobhunter"
version = "0.1.0"
description = "Busca vagas de desenvolvedor, ranqueia e adapta currículos."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "httpx>=0.27", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]