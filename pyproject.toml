[project]
name = "jobhunter"
version = "0.11.0"
description = "Busca vagas de desenvolvedor, ranqueia e adapta currículos."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
    "flask>=3.0",
]

[project.scripts]
jobhunter = "jobhunter.main:main"
jobhunter-web = "jobhunter.web.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Arquivos do site (HTML, CSS, JS) entram no pacote instalado (ex.: Docker).
[tool.setuptools.package-data]
"jobhunter.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]